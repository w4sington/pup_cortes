# =====================================================================
#  EXEMPLO DE CONFIGURACOES - o programa copia este arquivo para
#  configuracoes.ini na primeira vez. Mude no configuracoes.ini.
#  (o configuracoes.ini NAO vai para o GitHub: tem os ajustes deste PC)
# =====================================================================

# =====================================================================
#  CONFIGURACOES DO GERADOR DE CORTES
#  Mude o valor depois do "=" e salve o arquivo. Linhas com # sao
#  comentarios (o programa ignora).
# =====================================================================

[geral]
# Quantos cortes gerar de cada video
quantidade_cortes = 5

# Duracao de cada corte, em segundos
duracao_minima = 20
duracao_maxima = 60

# Idioma da fala do video (pt = portugues). Deixe vazio para detectar sozinho.
idioma = pt

# Tipo de video (o botao na tela inicial do app muda isto sozinho):
#   fala     = podcast, entrevista, live falada (ouve a fala e poe legenda)
#   gameplay = jogo quase sem fala: a IA ASSISTE as imagens e escreve um gancho
#              (precisa de um modelo com visao, ex.: Qwen3.5 com o mmproj)
tipo_video = fala


[gameplay]
# So para o tipo gameplay. Sai em pe, TELA CHEIA (so o jogo), sem marca d'agua nem credito.
# Nome do jogo (ajuda a IA a escrever os ganchos). Vazio = a IA descobre pelas imagens.
jogo =

# Duracao de cada corte, em segundos (fica entre a duracao minima e a maxima do [geral])
duracao = 40

# Quantos segundos o gancho fica escrito no topo (0 = o video todo)
gancho_segundos = 4


[ia]
# Endereco do servidor do LM Studio (o padrao e esse mesmo)
endereco_lm_studio = http://localhost:1234/v1

# Nome do modelo. Deixe vazio para usar o que estiver carregado no LM Studio.
modelo =

# Opcional: conte o assunto do canal para a IA escolher melhor.
# Exemplo: podcast de tecnologia e PCs gamer, com humor
tema_do_canal =

# Pasta dos modelos .gguf (Ajustes > Modelo de IA local).
# Vazio = a pasta do LM Studio (C:\Users\<voce>\.lmstudio\models)
pasta_modelos =

# Ultimo modelo (.gguf) carregado pelos Ajustes (o app preenche sozinho). E ele
# que o programa liga quando a IA estiver desligada: pelo llama-server do app,
# inteiro na placa de video e sem prender copia na RAM.
modelo_local =


[whisper]
# Modelo que transcreve a fala:
#   large-v3-turbo = melhor custo-beneficio (recomendado)
#   large-v3       = um pouco mais preciso, mais lento
#   small          = rapido, menos preciso (para PC fraco)
modelo_whisper = large-v3-turbo

# Usar a placa de video NVIDIA para transcrever (sim / nao)
usar_gpu = sim


[video]
# Como enquadrar em pe (9:16):
#   auto     = segue o rosto; se nao achar rosto, usa fundo desfocado
#   rosto    = sempre segue o rosto
#   desfoque = video inteiro no meio com fundo desfocado
modo = auto

# Legenda animada palavra por palavra (sim / nao)
legenda = sim

# Cor da palavra destacada: amarelo, verde, vermelho, azul, laranja,
# rosa, roxo, ciano, branco
cor_destaque = amarelo

# Quantas palavras aparecem por vez na legenda (1 a 6)
palavras_por_vez = 3

# Mostrar o titulo do corte no topo nos primeiros 5 segundos (sim / nao)
titulo_na_tela = sim

# Credito do canal original, escrito no rodape do video.
# Exemplo: @nomedocanal   (deixe vazio para nao mostrar)
credito =

# Usar a placa de video NVIDIA para gerar os videos (mais rapido)
usar_placa_de_video_no_encode = sim

# Qualidade maxima do video baixado pelo link (YouTube etc.):
#   720, 1080 (recomendado) ou maxima (4K pesa muito e corta devagar)
qualidade_download = 1080


# ---------------------------------------------------------------------
#  CAPAS (THUMBNAILS)
# ---------------------------------------------------------------------
# Gerar uma capa .jpg para cada corte (sim / nao)
capa = sim

# Fonte do texto da capa. Deixe vazio para usar a Arial Black.
# Pode colocar o nome de uma fonte instalada, ex.: impact.ttf
fonte_capa =


